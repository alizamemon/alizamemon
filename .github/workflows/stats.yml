name: Generate GitHub Stats (local, no external API dependency)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: jstrieb/github-stats@master
        with:
          username: alizamemon
          exclude_repos:
          exclude_langs:
          include_all_commits: true
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated stats
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add generated-images/ || true
          git commit -m "Update generated stats" || echo "No changes"
          git push
