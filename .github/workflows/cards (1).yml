name: Update Profile Cards (stats, langs, trophy, activity, snake)

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily
  workflow_dispatch: {}    # lets you trigger it manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=170e28&title_color=ff8fd8&icon_color=d46fe0&text_color=f3e8ff&ring_color=8f6fff
          path: dist/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Languages card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=170e28&title_color=ff8fd8&text_color=f3e8ff
          path: dist/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Trophy card
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Activity Graph
        continue-on-error: true
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=170e28&color=ff7eb6&line=8b5cf6&point=e879f9&area=true&area_color=8b5cf6&hide_border=true&custom_title=Contribution%20Graph
          output_path: dist/activity-graph.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Contribution Snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: List generated files (debug)
        run: ls -la dist/ || echo "dist folder is empty or missing"

      - name: Push all cards to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
