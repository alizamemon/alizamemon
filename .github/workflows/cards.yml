name: Update Profile Cards (stats, langs, trophy, activity, snake)

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily
  workflow_dispatch: {}    # lets you trigger it manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0b1329&title_color=38bdf8&icon_color=60a5fa&text_color=e2e8f0&ring_color=38bdf8
          path: dist/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Languages card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0b1329&title_color=38bdf8&text_color=e2e8f0
          path: dist/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Trophy card
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Activity Graph
        continue-on-error: true
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0b1329&color=38bdf8&line=60a5fa&point=38bdf8&area=true&area_color=1e3a8a&hide_border=true&custom_title=Contribution%20Graph
          output_path: dist/activity-graph.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Contribution Snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-dark.svg?palette=github-dark&color_snake=%2338bdf8&color_dots=%230d1b2a,%231e3a8a,%232563eb,%233b82f6,%2360a5fa

      - name: List generated files (debug)
        run: ls -la dist/ || echo "dist folder is empty or missing"

      - name: Push all cards to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
