<svg width="340" height="480" viewBox="0 0 340 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0f4a"/>
      <stop offset="100%" stop-color="#6a1b7d"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d46fe0"/>
      <stop offset="100%" stop-color="#8f6fff"/>
    </linearGradient>
    <radialGradient id="avatarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fd8"/>
      <stop offset="100%" stop-color="#8f6fff"/>
    </radialGradient>
    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fixed anchor at top -->
  <circle cx="170" cy="8" r="5" fill="#444"/>

  <!-- swinging group: strap + card pivoting from the anchor -->
  <g transform-origin="170px 8px">
    <animateTransform attributeName="transform" type="rotate"
      values="-3 170 8; 3 170 8; -3 170 8" dur="4.5s" repeatCount="indefinite"/>

    <!-- strap -->
    <rect x="160" y="8" width="20" height="130" rx="4" fill="url(#strapGrad)"/>
    <text x="170" y="90" text-anchor="middle" font-family="Fira Code, monospace" font-size="10"
      fill="#1a0b2e" transform="rotate(90 170 90)">ALIZA.DEV • SECURE • BUILD</text>

    <!-- clip ring -->
    <circle cx="170" cy="145" r="10" fill="none" stroke="#999" stroke-width="3"/>

    <!-- card -->
    <g transform="translate(20,155)">
      <rect x="0" y="0" width="300" height="300" rx="18" fill="url(#cardGrad)"
        stroke="#d46fe0" stroke-width="2" filter="url(#cardGlow)"/>

      <text x="20" y="30" font-family="Fira Code, monospace" font-size="11" fill="#c9a6ff">DEVELOPER ID</text>
      <text x="280" y="30" text-anchor="end" font-family="Fira Code, monospace" font-size="11" fill="#c9a6ff">AM-2026</text>

      <circle cx="150" cy="110" r="55" fill="url(#avatarGrad)"/>
      <text x="150" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#1a0b2e">AM</text>

      <text x="150" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ffffff">Aliza Memon</text>
      <text x="150" y="218" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#ff8fd8">COMPUTER ENGINEER</text>
      <text x="150" y="238" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#c9a6ff">@alizamemon</text>

      <!-- barcode -->
      <g transform="translate(30,255)" fill="#c9a6ff">
        <rect x="0" y="0" width="2" height="30"/>
        <rect x="5" y="0" width="1" height="30"/>
        <rect x="9" y="0" width="3" height="30"/>
        <rect x="15" y="0" width="1" height="30"/>
        <rect x="19" y="0" width="2" height="30"/>
        <rect x="24" y="0" width="1" height="30"/>
        <rect x="28" y="0" width="4" height="30"/>
        <rect x="35" y="0" width="1" height="30"/>
        <rect x="39" y="0" width="2" height="30"/>
        <rect x="44" y="0" width="1" height="30"/>
        <rect x="48" y="0" width="3" height="30"/>
        <rect x="54" y="0" width="2" height="30"/>
        <rect x="59" y="0" width="1" height="30"/>
        <rect x="63" y="0" width="4" height="30"/>
        <rect x="70" y="0" width="1" height="30"/>
        <rect x="74" y="0" width="2" height="30"/>
        <rect x="79" y="0" width="1" height="30"/>
        <rect x="83" y="0" width="3" height="30"/>
        <rect x="89" y="0" width="1" height="30"/>
        <rect x="93" y="0" width="2" height="30"/>
        <rect x="98" y="0" width="1" height="30"/>
      </g>
      <text x="150" y="298" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#8a6bb0">JAVA • CRYPTO • IoT</text>
    </g>
  </g>
</svg>
