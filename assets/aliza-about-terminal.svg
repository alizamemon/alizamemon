<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2b0f4a"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="640" height="360" rx="14" fill="url(#termBg)" stroke="#d46fe0" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="0" y="0" width="640" height="36" rx="14" fill="#241340"/>
  <rect x="0" y="22" width="640" height="14" fill="#241340"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="320" y="23" text-anchor="middle" font-size="12" fill="#c9a6ff">aliza@dev: ~/about-me</text>

  <!-- typed content -->
  <g font-size="15" fill="#f3e8ff">
    <text x="24" y="70" fill="#8f6fff">$ whoami</text>

    <text x="24" y="96" fill="#ff8fd8" font-weight="bold" font-size="18" opacity="0">
      Aliza Memon — Computer Engineer
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.6s" fill="freeze"/>
    </text>

    <text x="24" y="126" fill="#8f6fff" opacity="0">
      $ cat about.txt
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="24" y="154" opacity="0">
      🔭 Trainee Engineer @ Utopia Industries — Java, Spring Boot, IoT
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
    </text>

    <text x="24" y="180" opacity="0">
      🔐 Researching Post-Quantum Cryptography &amp; Privacy-Preserving Systems
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    </text>

    <text x="24" y="206" opacity="0">
      🎓 B.E. Computer Engineering — SSUET
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.5s" fill="freeze"/>
    </text>

    <text x="24" y="232" opacity="0">
      📍 Karachi, Pakistan
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.5s" fill="freeze"/>
    </text>

    <text x="24" y="258" opacity="0">
      💬 Ask me about cryptography, Java/Spring Boot, or React/Three.js
      <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.5s" fill="freeze"/>
    </text>

    <text x="24" y="296" fill="#ff8fd8" font-style="italic" opacity="0">
      "I don't just write code — I secure it."
      <animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.6s" fill="freeze"/>
    </text>

    <!-- blinking cursor -->
    <rect x="24" y="316" width="10" height="16" fill="#d46fe0" filter="url(#softGlow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="5.4s" dur="0.1s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" begin="5.5s" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
